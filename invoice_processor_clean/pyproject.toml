[project]
name = "invoice-data-extractor"
version = "0.1.0"
description = "Label invoices by clicking on words in the PDF, then fine-tune LayoutLMv3 to find the same fields automatically."
readme = "README.md"
requires-python = ">=3.11, <4"
dependencies = [
    "streamlit (>=1.49.1,<2.0.0)",
    "streamlit-image-coordinates (>=0.4.0,<0.5.0)",
    "pymupdf (>=1.26.4,<2.0.0)",
    "pillow (>=10.0.0)",
    "opencv-python (>=4.8.0)",
    "numpy (>=1.26.0)",
    "pandas (>=2.0.0)",
    "matplotlib (>=3.10.6,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "torch (>=2.0.0)",
    "transformers (>=4.56.1,<5.0.0)",
    "datasets (>=4.1.0,<5.0.0)",
    "accelerate (>=1.10.1,<2.0.0)",
    "seqeval (>=1.2.2,<2.0.0)",
]

[tool.poetry]
packages = [{include = "invoice_data_extractor", from = "src"}]

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.30.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
